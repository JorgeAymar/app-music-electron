<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Music Player</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>🎵 Music Player</h1>
    <form id="search-form" class="search-form">
      <input id="search-input" type="text" placeholder="Buscar canción, artista o álbum..." autofocus />
      <button type="submit">Buscar</button>
    </form>
    <div class="tabs">
      <button id="tab-search" class="tab-btn active" type="button">Inicio</button>
      <button id="tab-favorites" class="tab-btn" type="button">❤ Favoritos</button>
    </div>
  </header>

  <section class="player-bar" id="player-bar" hidden>
    <div class="player-frame-wrap">
      <iframe
        id="player-frame"
        allow="autoplay; encrypted-media"
        allowfullscreen
        frameborder="0"
      ></iframe>
    </div>
    <div class="now-playing">
      <img id="now-thumb" src="" alt="" />
      <div class="now-info">
        <span id="now-title">-</span>
        <span id="now-author">-</span>
      </div>
    </div>
  </section>

  <main class="content">
    <section id="results" class="results"></section>
  </main>
  <template id="heart-icon-template">
    <svg viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.33-8.36C.8 9.94 1.6 6.4 4.6 5.03c2.1-.96 4.3-.24 5.6 1.58l1.8 2.5 1.8-2.5c1.3-1.82 3.5-2.54 5.6-1.58 3 1.37 3.8 4.91 1.93 7.61C18.7 16.65 12 21 12 21z"/></svg>
  </template>

  <script src="renderer.js"></script>
</body>
</html>
